name: TwixRPGItems
version: '1.0.0'
main: com.twixrpg.items.TwixRPGItemsPlugin
api-version: '1.21'
description: Уникальные предметы TwixRPG — Аметистовая Кирка, Лабрис Гефеста, Фарм-Меч.
author: TwixRPG
website: https://twixrpg.example

commands:
  twixitems:
    description: Выдать уникальные предметы TwixRPG
    usage: /twixitems give <pickaxe|axe|sword|cell_basic|cell_advanced|cell_hybrid|cell_perfect> [ник]
    aliases: [twix]

permissions:
  twixitems.give:
    description: Право выдавать уникальные предметы
    default: op

# ============================================================
#  TwixRPG Items — конфигурация
# ============================================================

# Через сколько часов предмет исчезает с момента ПЕРВОГО сломанного блока
expire-hours: 36

items:
  # Прочность = прочность незерита (2031) + 700..1000.
  # Меняйте в этом диапазоне, если нужно (от 2731 до 3031).
  pickaxe-max-durability: 2900
  axe-max-durability: 2900
  sword-max-durability: 2900

tree-feller:
  # Максимум брёвен, ломаемых за один удар топором (защита от лагов)
  max-logs: 512
  # Максимум блоков листвы
  max-leaves: 1024

aoe:
  # Если true — при зажатом Shift предмет работает как обычный
  # (без добычи 3x3 и без рубки дерева целиком)
  sneak-disables: false

storage-cells:
  # Максимум предметов в одном слоте (по тиру ячейки)
  basic-max-per-slot: 512
  advanced-max-per-slot: 1024
  hybrid-max-per-slot: 2048
  perfect-max-per-slot: 4096
